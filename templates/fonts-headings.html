<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foglio Protocollo – Heading Pairings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;1,400&family=Inter:wght@600&family=Source+Sans+3:wght@600&family=IBM+Plex+Sans:wght@600&family=Work+Sans:wght@600&family=Fira+Sans:wght@600&family=Outfit:wght@600&display=swap">
<style>
  body { max-width: 80ch; margin: 2rem auto; padding: 0 1.5rem; background: #fdfcf8; color: #222; }
  .label { font-family: monospace; font-size: 12px; color: #999; margin-top: 3rem; }
  h2 { font-size: 28px; font-weight: 600; margin: 0.4rem 0 0.6rem; line-height: 1.25; }
  p { font-family: 'Literata', serif; font-size: 17px; line-height: 1.7; margin: 0; }
</style>
</head>
<body>
<div id="list"></div>
<script>
  const fonts = ["Inter", "Source Sans 3", "IBM Plex Sans", "Work Sans", "Fira Sans", "Outfit"];
  const text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.";
  const list = document.getElementById("list");
  fonts.forEach((f, i) => {
    list.insertAdjacentHTML("beforeend",
      `<div class="label">${i + 1}. ${f} + Literata</div>` +
      `<h2 style="font-family: '${f}', sans-serif">Lorem Ipsum Dolor Sit Amet</h2>` +
      `<p>${text}</p>`);
  });
</script>
</body>
</html>
