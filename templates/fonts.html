<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foglio Protocollo – Serif Specimens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Crimson+Pro&family=Source+Serif+4&family=Literata&family=Libre+Baskerville&family=Lora&family=Merriweather&family=Cormorant+Garamond&family=Spectral&family=Newsreader&display=swap">
<style>
  body { max-width: 80ch; margin: 2rem auto; padding: 0 1.5rem; background: #fdfcf8; color: #222; }
  .label { font-family: sans-serif; font-size: 13px; color: #888; margin-top: 2rem; }
  .sample { font-size: 20px; line-height: 1.6; margin: 0.3rem 0 0; }
</style>
</head>
<body>
<div id="list"></div>
<script>
  const fonts = ["EB Garamond", "Crimson Pro", "Source Serif 4", "Literata", "Libre Baskerville", "Lora", "Merriweather", "Cormorant Garamond", "Spectral", "Newsreader"];
  const text = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
  const list = document.getElementById("list");
  fonts.forEach((f, i) => {
    list.insertAdjacentHTML("beforeend",
      `<div class="label">${i + 1}. ${f}</div><p class="sample" style="font-family: '${f}', serif">${text}</p>`);
  });
</script>
</body>
</html>
